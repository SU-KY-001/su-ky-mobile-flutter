include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - lib/l10n/gen/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: error

linter:
  rules:
    - always_use_package_imports: false
    - avoid_print
    - prefer_single_quotes
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
    - directives_ordering
